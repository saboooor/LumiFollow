name: LumiFollow
version: '${version}'
main: io.github.saboooor.lumifollow.quests.LumiFollowPlugin
api-version: '1.21'
depend: [Citizens, BeautyQuests]
description: Configurable BeautyQuests NPC escort stages.
commands:
  lumifollow:
    description: Inspect LumiFollow status, reload escort profiles, or release NPC leases.
    usage: /<command> <status|reload|release <npc-id|all>>
    aliases: [lf]
    permission: lumifollow.admin
permissions:
  lumifollow.admin:
    description: Allows reloading LumiFollow and managing active NPC escort leases.
    default: op
